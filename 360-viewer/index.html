<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Interactive 360 Model Viewer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="viewer" id="viewer">

        <img
            id="model"
            class="model-image"
            src="frames/360-model-spin0001.webp"
            alt="Interactive 360-degree character model"
            draggable="false"
        >

        <!-- Windows XP-style loading window -->
        <div class="loading-screen" id="loadingScreen">

            <div class="xp-window loading-window">

                <div class="xp-titlebar">
                    <span class="xp-titlebar-icon">✦</span>

                    <span class="xp-titlebar-text">
                        Character Loader
                    </span>

                    <button
                        class="xp-close-button"
                        type="button"
                        aria-label="Close"
                        tabindex="-1"
                    >
                        ×
                    </button>
                </div>

                <div class="xp-window-content">

                    <div class="loading-message">
                        Loading character data...
                    </div>

                    <div class="loading-track">
                        <div
                            class="loading-progress"
                            id="loadingProgress"
                        ></div>
                    </div>

                    <div class="loading-bottom-row">

                        <span class="loading-status">
                            Please wait
                        </span>

                        <span
                            class="loading-percentage"
                            id="loadingPercentage"
                        >
                            0%
                        </span>

                    </div>

                </div>

            </div>

        </div>

        <!-- Windows XP-style drag prompt -->
        <div
            class="drag-instruction xp-window"
            id="dragInstruction"
        >

            <div class="xp-titlebar drag-titlebar">

                <span class="xp-titlebar-icon">
                    ↔
                </span>

                <span class="xp-titlebar-text">
                    Model Controls
                </span>

                <button
                    class="xp-close-button"
                    type="button"
                    aria-label="Close"
                    tabindex="-1"
                >
                    ×
                </button>

            </div>

            <div class="drag-window-content">
                Click and drag to rotate
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
